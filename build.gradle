plugins {
    id "java"
    id "idea"
    id "org.jetbrains.intellij.platform" version "2.2.1"
    id "pl.allegro.tech.build.axion-release" version "1.14.1"
}

group "net.ashald"

scmVersion {
    tag {
        prefix = "v"
        versionSeparator = ""
    }
}

allprojects {
    apply plugin: 'java'
    sourceCompatibility = 17
    targetCompatibility = 17

    repositories {
        mavenCentral()
    }

    project.version = scmVersion.version

    ext.jetbrains = [
            version : "2024.2.1",
            pycharm : "PythonCore:242.21829.142",
            rubymine: "org.jetbrains.plugins.ruby:242.21829.142",
            goland  : "org.jetbrains.plugins.go:242.21829.142",
            scala   : "org.intellij.scala:2024.2.25"
    ]
}

repositories {
    intellijPlatform {
        defaultRepositories()
    }
}

intellijPlatform {
    projectName = "EnvFile"
    buildSearchableOptions = false

    pluginConfiguration {
        name = "EnvFile"

        ideaVersion {
            sinceBuild = "253"
            untilBuild = "299"
        }
    }

    pluginVerification {
        ides {
            ide("IC", jetbrains.version)
        }
    }
}

dependencies {
    intellijPlatform {
        intellijIdeaCommunity(jetbrains.version)
        bundledPlugin("com.intellij.java")
        instrumentationTools()
    }

    implementation project(":envfile-products-idea")
    implementation project(":envfile-products-pycharm")
    implementation project(":envfile-products-rubymine")
    implementation project(":envfile-products-goland")
}

wrapper {
    gradleVersion = "8.5"
}
